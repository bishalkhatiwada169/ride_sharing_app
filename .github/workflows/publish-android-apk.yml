name: Publish Android APK

on:
  workflow_dispatch:
    inputs:
      use_debug_signing:
        description: Sign with debug keystore (smoke tests only)
        type: boolean
        default: false
      version_name:
        description: Optional versionName override (default package.json)
        type: string
        required: false
        default: ""
      version_code:
        description: Optional versionCode override (default android build.gradle)
        type: string
        required: false
        default: ""
  push:
    tags:
      - "android-v*"

concurrency:
  group: publish-android-apk
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build APK and upload to S3
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: stage

    defaults:
      run:
        working-directory: apps/passenger-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/passenger-mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: tools platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.1.12297006

      - name: Resolve version
        id: ver
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          PKG_VER="$(node -p "require('./apps/passenger-mobile/package.json').version")"
          GRADLE_CODE="$(grep -E 'versionCode\s+' apps/passenger-mobile/android/app/build.gradle | head -1 | grep -oE '[0-9]+' | head -1)"
          NAME="${{ github.event.inputs.version_name }}"
          CODE="${{ github.event.inputs.version_code }}"
          if [[ -z "${NAME}" ]]; then
            if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == android-v* ]]; then
              NAME="${GITHUB_REF_NAME#android-v}"
              NAME="${NAME%%+*}"
            else
              NAME="$PKG_VER"
            fi
          fi
          if [[ -z "${CODE}" ]]; then
            CODE="${GRADLE_CODE:-1}"
          fi
          echo "version_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Resolved $NAME+$CODE"

      - name: Decode release keystore
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.use_debug_signing) }}
        working-directory: ${{ github.workspace }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" || -z "${ANDROID_KEYSTORE_PASSWORD}" || -z "${ANDROID_KEY_ALIAS}" || -z "${ANDROID_KEY_PASSWORD}" ]]; then
            echo "Missing Android signing secrets."
            echo "Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD"
            echo "Or re-run with use_debug_signing=true for a smoke-test APK."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/passenger-mobile/android/app/upload-keystore.jks
          printf '%s\n' \
            "storePassword=${ANDROID_KEYSTORE_PASSWORD}" \
            "keyPassword=${ANDROID_KEY_PASSWORD}" \
            "keyAlias=${ANDROID_KEY_ALIAS}" \
            "storeFile=upload-keystore.jks" \
            > apps/passenger-mobile/android/key.properties

      - name: Install npm dependencies
        run: npm ci

      - name: Bake API endpoints into env.ts
        env:
          API_BASE_URL: ${{ vars.ANDROID_API_BASE_URL }}
        run: |
          set -euo pipefail
          API_BASE_URL="${API_BASE_URL:-https://api.ride.bkcs.app/api/v1}"
          API_BASE_URL="${API_BASE_URL%/}"
          if [[ "$API_BASE_URL" != */api/v1 ]]; then
            API_BASE_URL="${API_BASE_URL}/api/v1"
          fi
          ORIGIN="${API_BASE_URL%/api/v1}"
          WS_BASE="wss://${ORIGIN#https://}/ws"
          if [[ "$ORIGIN" == http://* ]]; then
            WS_BASE="ws://${ORIGIN#http://}/ws"
          fi
          export API_BASE_URL WS_BASE
          python3 - <<'PY'
          import os
          from pathlib import Path
          api = os.environ["API_BASE_URL"]
          ws = os.environ["WS_BASE"]
          Path("src/config/env.ts").write_text(
              "/**\n"
              " * Generated by CI publish-android-apk workflow — do not edit by hand in release builds.\n"
              " */\n"
              "export const Env = {\n"
              f"  apiBaseUrl: {api!r},\n"
              f"  wsBaseUrl: {ws!r},\n"
              "  environment: 'production' as 'local' | 'staging' | 'production',\n"
              "  brandName: 'Ride',\n"
              "  googleWebClientId: '' as string,\n"
              "};\n",
              encoding="utf-8",
          )
          print(f"Baked Env.apiBaseUrl={api}")
          PY

      - name: Build release APK
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            --no-daemon \
            -PreactNativeArchitectures=arm64-v8a \
            -PversionName="${{ steps.ver.outputs.version_name }}" \
            -PversionCode="${{ steps.ver.outputs.version_code }}"
          ls -lh app/build/outputs/apk/release/

      - name: Prepare artifacts
        id: art
        working-directory: ${{ github.workspace }}
        env:
          PUBLIC_BASE: ${{ vars.ANDROID_PUBLIC_BASE_URL }}
          S3_PREFIX: ${{ vars.ANDROID_S3_PREFIX }}
        run: |
          set -euo pipefail
          SRC="apps/passenger-mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$SRC"
          mkdir -p dist/android
          VER="${{ steps.ver.outputs.version_name }}+${{ steps.ver.outputs.version_code }}"
          cp "$SRC" "dist/android/ride-${VER}.apk"
          cp "$SRC" dist/android/ride-latest.apk
          SHA="$(sha256sum dist/android/ride-latest.apk | awk '{print $1}')"
          if [[ -z "${PUBLIC_BASE}" ]]; then
            echo "Missing variable ANDROID_PUBLIC_BASE_URL (public HTTPS base for APK downloads)"
            exit 1
          fi
          PUBLIC_BASE="${PUBLIC_BASE%/}"
          PREFIX="${S3_PREFIX:-android}"
          PREFIX="${PREFIX#/}"
          PREFIX="${PREFIX%/}"
          APK_URL="${PUBLIC_BASE}/${PREFIX}/ride-latest.apk"
          python3 - <<PY
          import json, pathlib
          payload = {
            "versionName": "${{ steps.ver.outputs.version_name }}",
            "versionCode": int("${{ steps.ver.outputs.version_code }}"),
            "apkUrl": "${APK_URL}",
            "apkSha256": "${SHA}",
            "label": "Ride app (passenger + driver)",
            "uploadedAt": __import__("datetime").datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
            "gitSha": "${GITHUB_SHA}"[:7],
            "repository": "${GITHUB_REPOSITORY}",
            "runId": "${GITHUB_RUN_ID}",
          }
          path = pathlib.Path("dist/android/version.json")
          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print(path.read_text())
          PY
          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Upload to S3
        working-directory: ${{ github.workspace }}
        env:
          BUCKET: ${{ vars.ANDROID_S3_BUCKET }}
          PREFIX: ${{ steps.art.outputs.prefix }}
        run: |
          set -euo pipefail
          if [[ -z "${BUCKET}" ]]; then
            echo "Missing variable ANDROID_S3_BUCKET"
            exit 1
          fi
          aws s3 cp dist/android/ride-latest.apk \
            "s3://${BUCKET}/${PREFIX}/ride-latest.apk" \
            --cache-control "public,max-age=300" \
            --content-type "application/vnd.android.package-archive"
          aws s3 cp dist/android/version.json \
            "s3://${BUCKET}/${PREFIX}/version.json" \
            --cache-control "public,max-age=60" \
            --content-type "application/json"
          for f in dist/android/ride-*.apk; do
            base="$(basename "$f")"
            [[ "$base" == "ride-latest.apk" ]] && continue
            aws s3 cp "$f" "s3://${BUCKET}/${PREFIX}/${base}" \
              --cache-control "public,max-age=86400" \
              --content-type "application/vnd.android.package-archive"
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ride-apk
          path: |
            dist/android/ride-latest.apk
            dist/android/version.json
          retention-days: 14

      - name: Summary
        working-directory: ${{ github.workspace }}
        run: |
          {
            echo "### Android APK published"
            echo ""
            echo "- Version: \`${{ steps.ver.outputs.version_name }}+${{ steps.ver.outputs.version_code }}\`"
            echo "- APK: ${{ steps.art.outputs.apk_url }}"
            echo "- Site: https://ride.bkcs.app/downloads"
            echo "- Manifest: ${{ vars.ANDROID_PUBLIC_BASE_URL }}/${{ steps.art.outputs.prefix }}/version.json"
          } >> "$GITHUB_STEP_SUMMARY"
