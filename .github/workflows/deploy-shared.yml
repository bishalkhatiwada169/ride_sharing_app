name: Deploy Shared Host

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy (empty = github.sha)
        required: false
        type: string
        default: ""

concurrency:
  group: deploy-ride-shared
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    name: Build image and deploy to bkcs-shared
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: stage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image meta
        id: meta
        run: |
          set -euo pipefail
          TAG="${{ inputs.image_tag }}"
          if [[ -z "$TAG" ]]; then TAG="${GITHUB_SHA}"; fi
          IMAGE="${REGISTRY}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "full=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            VITE_ANDROID_MANIFEST_URL=https://rideplatform-downloads-313411897974.s3.ap-south-1.amazonaws.com/android/version.json
            VITE_ENVIRONMENT=production
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY || secrets.SHARED_SSH_KEY }}
          HOST: ${{ vars.LIGHTSAIL_HOST || vars.SHARED_HOST }}
        run: |
          set -euo pipefail
          if [[ -z "${SSH_PRIVATE_KEY}" || -z "${HOST}" ]]; then
            echo "Missing LIGHTSAIL_SSH_KEY/SHARED_SSH_KEY or LIGHTSAIL_HOST/SHARED_HOST"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/shared.pem
          chmod 600 ~/.ssh/shared.pem
          if [[ "${HOST}" == *"@"* ]]; then
            host_only="${HOST##*@}"
          else
            host_only="${HOST}"
          fi
          ssh-keyscan -H "$host_only" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy on shared host
        env:
          HOST: ${{ vars.LIGHTSAIL_HOST || vars.SHARED_HOST }}
          SSH_USER: ${{ vars.LIGHTSAIL_USER || 'ubuntu' }}
          APP_IMAGE: ${{ steps.meta.outputs.full }}
          RIDE_DB_PASSWORD: ${{ secrets.RIDE_DB_PASSWORD }}
          RIDE_JWT_SECRET: ${{ secrets.RIDE_JWT_SECRET }}
          RIDE_BOOTSTRAP_SUPERADMIN_EMAIL: ${{ secrets.RIDE_BOOTSTRAP_SUPERADMIN_EMAIL }}
          RIDE_BOOTSTRAP_SUPERADMIN_PASSWORD: ${{ secrets.RIDE_BOOTSTRAP_SUPERADMIN_PASSWORD }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${RIDE_DB_PASSWORD}" || -z "${RIDE_JWT_SECRET}" ]]; then
            echo "Set RIDE_DB_PASSWORD and RIDE_JWT_SECRET in the stage environment." >&2
            exit 1
          fi
          if [[ "${HOST}" == *"@"* ]]; then
            ssh_user="${HOST%@*}"
            host_only="${HOST##*@}"
          else
            ssh_user="${SSH_USER}"
            host_only="${HOST}"
          fi
          ssh -i ~/.ssh/shared.pem -o IdentitiesOnly=yes \
            "${ssh_user}@${host_only}" \
            env \
              APP_IMAGE="$APP_IMAGE" \
              RIDE_DB_PASSWORD="$RIDE_DB_PASSWORD" \
              RIDE_JWT_SECRET="$RIDE_JWT_SECRET" \
              RIDE_BOOTSTRAP_SUPERADMIN_EMAIL="${RIDE_BOOTSTRAP_SUPERADMIN_EMAIL:-}" \
              RIDE_BOOTSTRAP_SUPERADMIN_PASSWORD="${RIDE_BOOTSTRAP_SUPERADMIN_PASSWORD:-}" \
              GHCR_USER="$GHCR_USER" \
              GHCR_TOKEN="$GHCR_TOKEN" \
              bash -s <<'EOS'
          set -euo pipefail
          cd /opt/bkcs
          test -f .env || { echo ".env missing on shared host"; exit 1; }
          upsert() {
            local key="$1" val="$2"
            if grep -q "^${key}=" .env; then
              sed -i "s|^${key}=.*|${key}=${val}|" .env
            else
              echo "${key}=${val}" >> .env
            fi
          }
          upsert RIDE_IMAGE "$APP_IMAGE"
          upsert RIDE_DB_PASSWORD "$RIDE_DB_PASSWORD"
          upsert RIDE_JWT_SECRET "$RIDE_JWT_SECRET"
          upsert RIDE_CORS_ALLOWED_ORIGINS "https://ride.bkcs.app,https://api.ride.bkcs.app"
          upsert RIDE_SMS_PROVIDER "mock"
          upsert RIDE_PAYMENT_PROVIDER "mock"
          if [[ -n "${RIDE_BOOTSTRAP_SUPERADMIN_EMAIL:-}" ]]; then
            upsert RIDE_BOOTSTRAP_SUPERADMIN_EMAIL "$RIDE_BOOTSTRAP_SUPERADMIN_EMAIL"
          fi
          if [[ -n "${RIDE_BOOTSTRAP_SUPERADMIN_PASSWORD:-}" ]]; then
            upsert RIDE_BOOTSTRAP_SUPERADMIN_PASSWORD "$RIDE_BOOTSTRAP_SUPERADMIN_PASSWORD"
          fi
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          chmod +x scripts/deploy-app.sh
          ./scripts/deploy-app.sh ride
          docker image prune -f
          EOS

      - name: Smoke check
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS "https://api.ride.bkcs.app/actuator/health" >/dev/null; then
              echo "API healthy"
              curl -fsS "https://api.ride.bkcs.app/actuator/health"
              echo
              curl -fsSI "https://ride.bkcs.app/" | head -n 15
              exit 0
            fi
            sleep 5
          done
          echo "Smoke check failed"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Ride shared-host deploy"
            echo ""
            echo "- Image: \`${{ steps.meta.outputs.full }}\`"
            echo "- Admin: https://ride.bkcs.app/"
            echo "- API: https://api.ride.bkcs.app/actuator/health"
          } >> "$GITHUB_STEP_SUMMARY"
