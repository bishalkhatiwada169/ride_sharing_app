# Local infrastructure for Ride Platform (Phases 1–7 MVP).
# Default: db + redis only.
# Optional full stack: docker compose --profile full up -d
#
# Admin UI is embedded in the backend jar (same origin on :8080).
# For HMR during local UI work, use Vite: `scripts/start-admin.ps1`.

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: ride-platform-db
    environment:
      POSTGRES_DB: ride_platform
      POSTGRES_USER: ride
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - ride_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ride -d ride_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ride-platform-redis
    ports:
      - "6379:6379"
    volumes:
      - ride_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    container_name: ride-platform-backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: local
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://db:5432/ride_platform
      DATABASE_USER: ride
      DATABASE_PASSWORD: change_me
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local_dev_only_change_me_to_long_random_secret_32chars
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080,http://localhost
      SMS_PROVIDER: mock
      PAYMENT_PROVIDER: mock
      DB_EMBEDDED: "false"
      FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/migration-postgis
      BOOTSTRAP_SUPERADMIN_EMAIL: ${BOOTSTRAP_SUPERADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_SUPERADMIN_PASSWORD: ${BOOTSTRAP_SUPERADMIN_PASSWORD:-ChangeMeNow123!}
      APK_DOWNLOADS_DIR: /app/apks
      APK_PUBLIC_BASE_URL: ${APK_PUBLIC_BASE_URL:-http://192.168.18.6:8080}
    volumes:
      - ../../artifacts/apks:/app/apks:ro
    ports:
      - "8080:8080"
    profiles:
      - full

volumes:
  ride_pg_data:
  ride_redis_data:
