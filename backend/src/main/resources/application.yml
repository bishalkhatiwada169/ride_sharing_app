spring:
  application:
    name: ride-platform-backend
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ride_platform}
    username: ${DATABASE_USER:ride}
    password: ${DATABASE_PASSWORD:change_me}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    # Default: Phase 1 auth schema. Add classpath:db/migration-postgis when using PostGIS (Docker image).
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    redis:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

rideplatform:
  db:
    # true = embedded Postgres for local without Docker (default). false = use DATABASE_URL.
    embedded: ${DB_EMBEDDED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:local_dev_only_change_me_to_long_random_secret_32chars}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:2592000}
  sms:
    provider: ${SMS_PROVIDER:mock}
  payment:
    provider: ${PAYMENT_PROVIDER:mock}
    api-key: ${PAYMENT_API_KEY:}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:local_webhook_secret}
    commission-bps: ${PAYMENT_COMMISSION_BPS:2000}
  otp:
    length: 6
    ttl-seconds: 300
    max-attempts: 5
  matching:
    max-radius-meters: ${MATCHING_MAX_RADIUS_METERS:8000}
    location-stale-seconds: ${MATCHING_LOCATION_STALE_SECONDS:180}
    offer-timeout-seconds: ${MATCHING_OFFER_TIMEOUT_SECONDS:25}
    search-timeout-seconds: ${MATCHING_SEARCH_TIMEOUT_SECONDS:180}
    auto-accept: ${MATCHING_AUTO_ACCEPT:true}
    offer-poll-ms: 5000
    search-poll-ms: 15000

logging:
  level:
    root: INFO
    com.rideplatform: INFO
